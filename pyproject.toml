[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-outlook-workflow-agent"
version = "0.1.0"
description = "Rule engine bridging Jira webhooks to Outlook calendar actions with LLM reasoning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Reginald Baraza", email = "reginaldbaraza-code@users.noreply.github.com"},
]
keywords = ["jira", "outlook", "automation", "workflow", "calendar"]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
